# Required sections
name: Many Times the Key
author: "PA TSA Cybersecurity Coordinator"
category: Cryptography
description: |
  An intern thought XOR was a secure encryption method and used the same short key to encrypt a secret message.
  The ciphertext is provided as a hex string below.
  Can you recover the plaintext?

  ### Ciphertext (hex)
  `1a0b1e1c5f1d074f120a1e035f061d074f`

  ### Hint
  The key is a common 3-letter word.
attribution: "PA TSA Cybersecurity Coordinator"
value: 200
type: standard

