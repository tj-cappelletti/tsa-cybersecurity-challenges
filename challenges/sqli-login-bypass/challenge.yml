# Require all team members to submit any flag: team
logic: all

flags:
    - flag{1dc3c081-24c8-4b35-bf7b-21c836f111a3}

hints:
    - title: Concept Hint
      content: When user input is inserted directly into a database query without sanitization, an attacker can manipulate the query logic.
      cost: 50
    - title: Payload Hint
      content: Try entering a single quote `'` in the username field and observe the response. What happens?
      cost: 75

