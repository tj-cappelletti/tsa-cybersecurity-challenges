# Required sections
name: SQLi Login Bypass
author: "PA TSA Cybersecurity Coordinator"
category: Web Exploitation
description: |
  This login form looks secure at first glance.
  But the developer forgot one of the most fundamental rules of web security: never trust user input.
  Can you get in without knowing the password?

  ### Target
  http://web-03.ctf.local
attribution: "PA TSA Cybersecurity Coordinator"
value: 300
type: standard

# Unused but listed as required for CTFd compatibility. Can be removed if unused.
image: null
protocol: null
host: null

attempts: 5

# Specifies flag processing behavior of challenge
# Accept any flag (default): any
