name: Sweet Cookies
author: "PA TSA Cybersecurity Coordinator"
category: Web Exploitation
description: |
  This web application has a members-only area.
  You've managed to create a regular user account, but the admin panel is off limits.
  Or is it?
  Inspect how the application tracks who you are — the answer might be sweeter than you think.

  ### Target
  http://web-02.ctf.local
