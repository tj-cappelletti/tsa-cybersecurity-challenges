      content: Web applications often store user role or privilege information client-side. Where does your browser store data that gets sent with every request?
      cost: 50
    - title: Tooling Hint
      content: Open your browser's developer tools (F12), navigate to the Application or Storage tab, and look at your cookies.
      cost: 75

